[project]
name = "motus-vision2pose"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "mediapipe==1.2.3",
    "mujoco==3.3.7",
    "numpy==2.2.6",
    "pyyaml==6.0.3",
    "scipy==1.15.3",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
